{% extends "layout/main_layout.html" %}
{% block title %}투표 결과{% endblock title %}
{% block contents%}
<h1>투표 결과</h1>
<b>질문 : {{question.pk}}. {{question.question_text}}</b>
<ol class="list-group mt-3">
    {% for choice in choice_list %}
        <li class="list-group-item">{{choice.choice_text}} - {{choice.votes}}</li>
    {% endfor %}
</ol>
{% endblock contents%}
